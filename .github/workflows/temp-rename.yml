name: Temporary rename
on:
  push:
    paths:
      - '.github/workflows/temp-rename.yml'
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: |
          if [ -f chef-harwash-website.html ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git mv -f chef-harwash-website.html index.html
            git commit -m "Rename chef-harwash-website.html to index.html"
            git push
          else
            echo "Source file not present; nothing to rename."
          fi
